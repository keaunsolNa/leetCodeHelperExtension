<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Helper Settings</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #444; }
    input {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 0.9rem; box-sizing: border-box; margin-bottom: 16px;
    }
    button {
      padding: 10px 24px; background: #2563eb; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 12px; font-size: 0.85rem; color: #16a34a; min-height: 20px; }
  </style>
</head>
<body>
  <h1>LeetCode Helper Settings</h1>
  <label for="githubToken">GitHub Personal Access Token (repo scope)</label>
  <input type="password" id="githubToken" placeholder="ghp_..." />
  <label for="githubOwner">GitHub Username</label>
  <input type="text" id="githubOwner" placeholder="username" />
  <label for="githubRepo">Repository Name</label>
  <input type="text" id="githubRepo" placeholder="algorithm-study" />
  <label for="basePath">Base Path in Repo</label>
  <input type="text" id="basePath" placeholder="leetcode" />
  <label for="groqApiKey">Groq API Key</label>
  <input type="password" id="groqApiKey" placeholder="gsk_..." />
  <button id="saveBtn">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
